<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Service Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشاشة الأولى: الهدية -->
    <div id="gift-overlay" class="overlay-screen">
        <div class="gift-box" onclick="openGift()">
            <div class="gift-icon">🎁</div>
            <p class="gift-text">تم ارسال لك هدية من طرف صديق اضغط للفتح</p>
        </div>
    </div>

    <!-- الشاشة الثانية: المربع الأخضر فقط (بعد الضغط) -->
    <div id="hacker-overlay" class="overlay-screen hidden">
        <div class="matrix-box">
            <div class="matrix-code" id="matrix-code"></div>
        </div>
    </div>

    <script type="module" src="script.js?v=3.0"></script>
</body>
</html>
