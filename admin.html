<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM LOGS // IP MONITOR</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #05080a;
            color: #00ff66;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #00ff66;
            padding-bottom: 10px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .btn-refresh {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 20px;
            width: 100%;
        }

        .log-card {
            background-color: #0d131a;
            border: 1px solid #1f2937;
            border-left: 4px solid #00ff66;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            color: #e5e7eb;
        }

        .log-row {
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .log-row strong {
            color: #00ff66;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action {
            padding: 5px 15px;
            border: 1px solid;
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .btn-copy {
            border-color: #00ff66;
            color: #00ff66;
        }

        .btn-delete {
            border-color: #ff4444;
            color: #ff4444;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>SYSTEM LOGS // IP MONITOR</h2>
        </div>

        <button class="btn-refresh" onclick="fetchIPs()">[ REFRESH IP LOGS ]</button>

        <div id="logs-container">
            <!-- سيتم تحميل سجلات الـ IP والتفاصيل هنا -->
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "beauty-store-4f012.firebaseapp.com",
            projectId: "beauty-store-4f012",
            storageBucket: "beauty-store-4f012.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        async function fetchIPs() {
            const container = document.getElementById("logs-container");
            container.innerHTML = "<p style='text-align:center;'>جاري تحميل السجلات...</p>";

            try {
                const snapshot = await db.collection("visitors").orderBy("timestamp", "desc").get();
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p style='text-align:center;'>لا توجد سجلات حالياً</p>";
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const docId = doc.id;
                    const ip = data.ip || "Unknown IP";
                    const country = data.country || "غير معروف";
                    const region = data.region || "غير معروف";
                    const city = data.city || "غير معروف";
                    const zip = data.zip || "غير متوفر";
                    const isp = data.isp || "غير معروف";
                    
                    let timeString = "غير محدد";
                    if (data.timestamp) {
                        timeString = data.timestamp.toDate().toLocaleString('ar-EG');
                    }

                    const card = document.createElement("div");
                    card.className = "log-card";
                    card.innerHTML = `
                        <div class="log-row"><strong>IP:</strong> ${ip}</div>
                        <div class="log-row"><strong>الموقع:</strong> ${country} - ${region} - ${city}</div>
                        <div class="log-row"><strong>الرمز البريدي:</strong> ${zip}</div>
                        <div class="log-row"><strong>مزود الخدمة:</strong> ${isp}</div>
                        <div class="log-row"><strong>الوقت:</strong> ${timeString}</div>
                        <div class="btn-group">
                            <button class="btn-action btn-copy" onclick="navigator.clipboard.writeText('${ip}')">نسخ IP</button>
                            <button class="btn-action btn-delete" onclick="deleteLog('${docId}')">حذف</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("خطأ في جلب السجلات:", error);
                container.innerHTML = "<p style='color:red; text-align:center;'>حدث خطأ أثناء جلب البيانات</p>";
            }
        }

        async function deleteLog(id) {
            if (confirm("هل أنت تأكد من حذف هذا السجل؟")) {
                await db.collection("visitors").doc(id).delete();
                fetchIPs();
            }
        }

        document.addEventListener("DOMContentLoaded", fetchIPs);
    </script>
</body>
</html>
