<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - حماية Firebase</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: monospace, monospace;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: #238636;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #2ea043;
    }
    .btn-danger {
      background: #da3633;
      width: auto;
      padding: 6px 12px;
    }
    .hidden {
      display: none;
    }
    .log-item {
      border-bottom: 1px solid #30363d;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">

  <!-- نموذج تسجيل الدخول -->
  <div id="loginSection" class="card">
    <h2>تسجيل الدخول للوحة التحكم</h2>
    <p id="authError" style="color: #f85149; display: none;"></p>
    <input type="email" id="emailInput" placeholder="البريد الإلكتروني">
    <input type="password" id="passwordInput" placeholder="كلمة السر">
    <button id="loginBtn">دخول</button>
  </div>

  <!-- لوحة التحكم (مخفية تلقائياً حتى تسجيل الدخول) -->
  <div id="adminSection" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>سجلات الزوار (IP Logs)</h2>
      <button id="logoutBtn" class="btn-danger">تسجيل الخروج</button>
    </div>
    <hr style="border-color: #30363d;">
    <div id="logsList">جاري تحميل البيانات...</div>
  </div>

</div>

<script>
  // 1. ضع بيانات مشروعك هنا من Firebase Console
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // تهيئة فايربيز
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // عناصر واجهة المستخدم
  const loginSection = document.getElementById('loginSection');
  const adminSection = document.getElementById('adminSection');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const authError = document.getElementById('authError');
  const logsList = document.getElementById('logsList');

  // 2. مراقبة حالة تسجيل الدخول
  auth.onAuthStateChanged((user) => {
    if (user) {
      // المستخدم مسجل دخوله بنجاح
      loginSection.classList.add('hidden');
      adminSection.classList.remove('hidden');
      loadVisitorLogs();
    } else {
      // المستخدم غير مسجل دخوله
      loginSection.classList.remove('hidden');
      adminSection.classList.add('hidden');
      logsList.innerHTML = '';
    }
  });

  // 3. زر تسجيل الدخول
  loginBtn.addEventListener('click', () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    authError.style.display = 'none';

    auth.signInWithEmailAndPassword(email, password)
      .catch((error) => {
        authError.style.display = 'block';
        authError.textContent = "خطأ في تسجيل الدخول: " + error.message;
      });
  });

  // 4. زر تسجيل الخروج
  logoutBtn.addEventListener('click', () => {
    auth.signOut();
  });

  // 5. جلب السجلات من Firestore
  function loadVisitorLogs() {
    db.collection('visitors').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
      logsList.innerHTML = '';
      if (snapshot.empty) {
        logsList.innerHTML = '<p>لا يوجد سجلات حالياً.</p>';
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <div>
            <strong>IP:</strong> ${data.ip || 'غير معروف'}<br>
            <small><strong>الموقع:</strong> ${data.location || 'غير معروف'} | <strong>الوقت:</strong> ${data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString('ar-EG') : 'غير محدد'}</small>
          </div>
          <button class="btn-danger" onclick="deleteLog('${doc.id}')">حذف</button>
        `;
        logsList.appendChild(item);
      });
    }, (error) => {
      logsList.innerHTML = `<p style="color: #f85149;">خطأ في جلب البيانات: ${error.message}</p>`;
    });
  }

  // 6. دالة حذف سجل
  window.deleteLog = function(docId) {
    if (confirm("هل أنت تأكد من حذف هذا السجل؟")) {
      db.collection('visitors').doc(docId).delete()
        .then(() => {
          alert("تم الحذف بنجاح");
        })
        .catch((error) => {
          alert("خطأ أثناء الحذف: " + error.message);
        });
    }
  };
</script>

</body>
</html>
