<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_CORE // IP MONITOR</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-green: #00ff66;
            --danger-red: #ff3344;
            --border-color: #30363d;
            --text-color: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            font-family: 'Fira Code', monospace, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 10px;
            direction: rtl;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--accent-green);
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--accent-green);
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card-title {
            color: var(--accent-green);
            font-size: 1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--accent-green);
        }

        input {
            width: 100%;
            padding: 12px;
            background: #090d11;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--accent-green);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 5px rgba(0,255,102,0.3);
        }

        .btn {
            background: transparent;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 10px rgba(0,255,102,0.5);
        }

        .btn-danger {
            color: var(--danger-red);
            border-color: var(--danger-red);
        }

        .btn-danger:hover {
            background: var(--danger-red);
            color: #fff;
            box-shadow: 0 0 10px rgba(255,51,68,0.5);
        }

        .ip-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ip-item {
            background: #090d11;
            border: 1px solid var(--border-color);
            border-right: 4px solid var(--accent-green);
            border-radius: 4px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ip-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ip-address {
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .ip-time {
            font-size: 0.75rem;
            color: #8b949e;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .status-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            margin-left: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><span class="status-badge"></span> SYSTEM LOGS // IP MONITOR</h1>
    </div>

    <!-- بطاقة تغيير كلمة السر -->
    <div class="card">
        <div class="card-title">> CONFIG_SECURITY</div>
        <div class="input-group">
            <label for="newPass">تحديث كلمة السر النظام:</label>
            <input type="text" id="newPass" placeholder="أدخل كلمة السر الجديدة...">
        </div>
        <button class="btn" onclick="updatePassword()">[ SAVE_SETTINGS ]</button>
    </div>

    <!-- بطاقة مراقبة الـ IP -->
    <div class="card">
        <div class="card-title" style="justify-content: space-between;">
            <span>> ACTIVE_CONNECTIONS (IP_LOGS)</span>
            <button class="btn" onclick="fetchIPs()">[ REFRESH ]</button>
        </div>
        <div id="ipContainer" class="ip-list">
            <div style="text-align: center; color: #8b949e; padding: 15px;">جاري جلب السجلات...</div>
        </div>
    </div>
</div>

<script>
    // إعدادات Firebase الخاصة بك (استبدل القيم بقيم مشروعك إذا اختلفت)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "beauty-store-4f012.firebaseapp.com",
        projectId: "beauty-store-4f012",
        storageBucket: "beauty-store-4f012.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // تحديث كلمة السر في store_config
    function updatePassword() {
        const pass = document.getElementById('newPass').value.trim();
        if (!pass) {
            alert("يرجى إدخال كلمة سر صحيحة!");
            return;
        }

        db.collection("store_config").doc("main").set({
            pass: pass
        }, { merge: true })
        .then(() => {
            alert("تم تحديث كلمة السر بنجاح!");
            document.getElementById('newPass').value = '';
        })
        .catch(error => {
            alert("حدث خطأ في الحفظ: " + error.message);
        });
    }

    // جلب وعرض عناوين الـ IP
    function fetchIPs() {
        const container = document.getElementById('ipContainer');
        container.innerHTML = '<div style="text-align: center; color: #8b949e; padding: 15px;">جاري تحديث البيانات...</div>';

        db.collection("visitors").orderBy("timestamp", "desc").get()
        .then((snapshot) => {
            if (snapshot.empty) {
                container.innerHTML = '<div style="text-align: center; color: #8b949e; padding: 15px;">لا توجد اتصالات مسجلة حالياً.</div>';
                return;
            }

            container.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const ip = data.ip || "Unknown IP";
                const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString('ar-EG') : "تاريخ غير معروف";

                const item = document.createElement('div');
                item.className = 'ip-item';
                item.innerHTML = `
                    <div class="ip-info">
                        <span class="ip-address">IP: ${ip}</span>
                        <span class="ip-time">TIME: ${time}</span>
                    </div>
                    <div class="actions">
                        <button class="btn" onclick="copyText('${ip}')">نسخ</button>
                        <button class="btn btn-danger" onclick="deleteIP('${doc.id}')">حذف</button>
                    </div>
                `;
                container.appendChild(item);
            });
        })
        .catch((error) => {
            container.innerHTML = `<div style="text-align: center; color: var(--danger-red); padding: 15px;">خطأ في الجلب: ${error.message}</div>`;
        });
    }

    function copyText(text) {
        navigator.clipboard.writeText(text);
        alert("تم نسخ العنوان: " + text);
    }

    function deleteIP(id) {
        if (confirm("هل انت محقق من حذف السجل؟")) {
            db.collection("visitors").doc(id).delete()
            .then(() => {
                fetchIPs();
            })
            .catch(error => alert("خطأ الحذف: " + error.message));
        }
    }

    // تشغيل جلب البيانات فور فتح الصفحة
    window.onload = fetchIPs;
</script>

</body>
</html>
