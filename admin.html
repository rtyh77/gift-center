<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>

    <!-- إعدادات تطبيق الويب (PWA) -->
    <link rel="manifest" href="/beauty-store/admin-manifest.json">
    <meta name="theme-color" content="#d81b60">
    
    <!-- دعم أجهزة iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="اللوحة">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3524/3524659.png">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d81b60;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 30px; }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; }

        header { background: var(--card-bg); padding: 15px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; display: none; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 25px; }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; color: white; outline: none; }
        textarea { resize: vertical; min-height: 80px; }

        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-copy { background: #0284c7; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-right: 5px; }
        .btn-edit { background: #eab308; padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; border: none; color: black; font-weight: bold; cursor: pointer; }
        .btn-delete { background: #ef4444; padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; border: none; color: white; font-weight: bold; cursor: pointer; }

        #loadingIndicator { display: none; text-align: center; color: #38bdf8; font-weight: bold; margin-top: 10px; }

        .order-card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; }
        .product-item { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center; }
        .product-item img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        
        .ip-badge { background: #334155; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color:var(--primary); margin-bottom:15px;">🔐 دخول Admin</h2>
            <div class="form-group"><input type="password" id="passInput" placeholder="كلمة السر"></div>
            <button class="btn" onclick="checkPassword()">دخول</button>
        </div>
    </div>

    <header><h2>⚙️ لوحة إدارة المتجر</h2></header>

    <div class="container" id="mainContent">

        <div class="card">
            <h3>⚙️ إعدادات المتجر (الواتساب وكلمة السر)</h3>
            <div class="form-group"><label>رقم الواتساب (مع رمز الدولة):</label><input type="text" id="setWa" placeholder="213656708603"></div>
            <div class="form-group"><label>كلمة سر لوحة التحكم:</label><input type="password" id="setPass" placeholder="كلمة السر الجديدة"></div>
            <button class="btn" onclick="saveSettings()">حفظ الإعدادات</button>
        </div>

        <div class="card">
            <h3>✨ إضافة عطر / منتج جديد</h3>
            <form id="productForm">
                <div class="form-group"><label>اسم العطر / المنتج:</label><input type="text" id="pName" placeholder="مثال: عطر الفخامة الملكي" required></div>
                <div class="form-group">
                    <label>الفئة:</label>
                    <select id="pCat" required>
                        <option value="عطور صيفية">عطور صيفية</option>
                        <option value="عطور للمناسبات">عطور للمناسبات</option>
                        <option value="العناية بالبشرة">العناية بالبشرة</option>
                        <option value="الكريمان والمرطبات">الكريمان والمرطبات</option>
                        <option value="المكياج والجمال">المكياج والجمال</option>
                    </select>
                </div>
                <div class="form-group"><label>وصف العطر / المنتج:</label><textarea id="pDesc" placeholder="اكتب وصفاً مختصراً ومميزاً للعطر..."></textarea></div>
                <div class="form-group"><label>السعر (د.ج):</label><input type="number" id="pPrice" placeholder="مثال: 4500" required></div>
                <div class="form-group"><label>الكمية المتاحة:</label><input type="number" id="pQty" value="1" min="1" required></div>
                <div class="form-group">
                    <label>صور العطر (حتى 3 صور كحد أقصى):</label>
                    <input type="file" id="pImgFiles" accept="image/*" multiple required>
                </div>
                <button type="submit" class="btn" id="submitBtn">نشر المنتج في المتجر</button>
                <div id="loadingIndicator">⏳ جاري معالجة الصور ورفع المنتج...</div>
            </form>
        </div>

        <div class="card">
            <h3>📦 الطلبات الواردة</h3>
            <div id="ordersContainer">جاري التحميل...</div>
        </div>

        <div class="card">
            <h3>🛍️ المنتجات الحالية</h3>
            <div class="products-grid" id="productsContainer">جاري التحميل...</div>
        </div>

    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px; color:var(--primary);">تعديل المنتج</h3>
            <input type="hidden" id="editId">
            <div class="form-group"><label>الاسم:</label><input type="text" id="editName"></div>
            <div class="form-group">
                <label>الفئة:</label>
                <select id="editCat">
                    <option value="عطور صيفية">عطور صيفية</option>
                    <option value="عطور للمناسبات">عطور للمناسبات</option>
                    <option value="العناية بالبشرة">العناية بالبشرة</option>
                    <option value="الكريمان والمرطبات">الكريمان والمرطبات</option>
                    <option value="المكياج والجمال">المكياج والجمال</option>
                </select>
            </div>
            <div class="form-group"><label>وصف العطر:</label><textarea id="editDesc"></textarea></div>
            <div class="form-group"><label>السعر (د.ج):</label><input type="number" id="editPrice"></div>
            <div class="form-group"><label>الكمية المتاحة:</label><input type="number" id="editQty"></div>
            <button class="btn" onclick="saveEditProduct()">تحديث البيانات</button>
            <button class="btn" onclick="closeEditModal()" style="background:#64748b; margin-top:8px;">إلغاء</button>
        </div>
    </div>

    <!-- تسجيل الـ Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/beauty-store/sw.js', { scope: '/beauty-store/' })
          .then(() => console.log('Admin PWA Registered Successfully'))
          .catch(err => console.log('SW registration failed: ', err));
      }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD60g3bc-e6h9JMRUR3eKcD5oRO2rAb4vQ",
          authDomain: "beauty-store-4f012.firebaseapp.com",
          projectId: "beauty-store-4f012",
          storageBucket: "beauty-store-4f012.firebasestorage.app",
          messagingSenderId: "1053116874470",
          appId: "1:1053116874470:web:32a41e8ce3e089d1920527"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentPass = "123";
        let compressedImages = [];
        let loadedProducts = [];

        // جلب الإعدادات فور فتح الصفحة لضمان التحقق من كلمة السر الصحيحة
        async function loadConfig() {
            try {
                const docSnap = await getDoc(doc(db, "settings", "store_config"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.pass) currentPass = data.pass;
                    if (data.whatsapp) document.getElementById('setWa').value = data.whatsapp;
                    document.getElementById('setPass').value = currentPass;
                }
            } catch (e) {
                console.error("خطأ أثناء جلب الإعدادات:", e);
            }
        }

        // استدعاء جلب الإعدادات عند بداية التشغيل
        loadConfig();

        window.checkPassword = async function() {
            // إعادة جلب أحدث كلمة سر من قاعدة البيانات مباشرة قبل التحقق
            await loadConfig();
            const inputVal = document.getElementById('passInput').value;
            if (inputVal === currentPass) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadData();
            } else { 
                alert("كلمة السر خاطئة!"); 
            }
        };

        window.saveSettings = async function() {
            const wa = document.getElementById('setWa').value;
            const pass = document.getElementById('setPass').value;
            try {
                await setDoc(doc(db, "settings", "store_config"), { whatsapp: wa, pass: pass }, { merge: true });
                currentPass = pass;
                alert("تم حفظ الإعدادات بنجاح!");
            } catch (e) { alert("حدث خطأ في حفظ الإعدادات!"); }
        };

        const compressFile = (file) => new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxWidth = 600;
                    canvas.width = maxWidth;
                    canvas.height = img.height * (maxWidth / img.width);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.65));
                };
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('pImgFiles').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files).slice(0, 3);
            if (files.length === 0) return;
            compressedImages = [];
            for (let file of files) {
                const b64 = await compressFile(file);
                compressedImages.push(b64);
            }
        });

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (compressedImages.length === 0) return alert("اختر صورة واحدة على الأقل!");

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loadingIndicator');
            submitBtn.disabled = true; loading.style.display = 'block';

            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('pName').value,
                    category: document.getElementById('pCat').value,
                    description: document.getElementById('pDesc').value || "",
                    price: Number(document.getElementById('pPrice').value),
                    stock: Number(document.getElementById('pQty').value) || 1,
                    image: compressedImages[0],
                    images: compressedImages,
                    createdAt: serverTimestamp()
                });
                alert("تم إضافة المنتج بنجاح!");
                document.getElementById('productForm').reset();
                compressedImages = [];
                loadProducts();
            } catch (err) { alert("حدث خطأ أثناء حفظ المنتج!"); }
            finally { submitBtn.disabled = false; loading.style.display = 'none'; }
        });

        function loadData() { loadOrders(); loadProducts(); }

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            try {
                const snapshot = await getDocs(collection(db, "orders"));
                container.innerHTML = snapshot.empty ? "<p>لا توجد طلبات.</p>" : "";
                snapshot.forEach(docSnap => {
                    const o = docSnap.data();
                    const clientIP = o.ipAddress || 'غير معروف';
                    container.innerHTML += `
                        <div class="order-card">
                            <div>
                                <strong>👤 ${o.customerName}</strong> 
                                (<span id="p-${docSnap.id}">${o.phone}</span>)
                                <button class="btn-copy" onclick="copyText('${o.phone}')">📋 نسخ الهاتف</button><br>
                                📍 ${o.address}<br>
                                🌐 IP الزائر: <span class="ip-badge">${clientIP}</span> 
                                <button class="btn-copy" onclick="copyText('${clientIP}')">📋 نسخ IP</button><br>
                                🛒 ${o.items.map(i => `${i.name} [x${i.qty}]`).join(', ')} - <strong>${o.total} د.ج</strong>
                            </div>
                            <button class="btn-delete" onclick="deleteOrder('${docSnap.id}')">حذف</button>
                        </div>
                    `;
                });
            } catch (e) { container.innerHTML = "خطأ في التحميل."; }
        }

        window.copyText = function(text) {
            navigator.clipboard.writeText(text);
            alert("تم النسخ بنجاح: " + text);
        };

        async function loadProducts() {
            const container = document.getElementById('productsContainer');
            try {
                const snapshot = await getDocs(collection(db, "products"));
                loadedProducts = [];
                container.innerHTML = snapshot.empty ? "<p>لا توجد منتجات.</p>" : "";
                snapshot.forEach(docSnap => {
                    const prod = { id: docSnap.id, ...docSnap.data() };
                    loadedProducts.push(prod);
                    const mainImg = prod.images && prod.images.length ? prod.images[0] : prod.image;
                    container.innerHTML += `
                        <div class="product-item">
                            <img src="${mainImg}">
                            <h4>${prod.name}</h4>
                            <p style="color:var(--primary); font-weight:bold;">${prod.price} د.ج</p>
                            <p style="font-size:0.8rem; color:#94a3b8;">الكمية: ${prod.stock || 1}</p>
                            <div style="display:flex; gap:5px; margin-top:5px; justify-content:center;">
                                <button class="btn-edit" onclick="openEditModal('${prod.id}')">تعديل</button>
                                <button class="btn-delete" onclick="deleteProduct('${prod.id}')">حذف</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) { container.innerHTML = "خطأ في التحميل."; }
        }

        window.openEditModal = function(id) {
            const prod = loadedProducts.find(p => p.id === id);
            if(prod) {
                document.getElementById('editId').value = prod.id;
                document.getElementById('editName').value = prod.name;
                document.getElementById('editCat').value = prod.category || 'عطور صيفية';
                document.getElementById('editDesc').value = prod.description || '';
                document.getElementById('editPrice').value = prod.price;
                document.getElementById('editQty').value = prod.stock || 1;
                document.getElementById('editModal').style.display = 'flex';
            }
        };

        window.closeEditModal = function() { document.getElementById('editModal').style.display = 'none'; };

        window.saveEditProduct = async function() {
            const id = document.getElementById('editId').value;
            try {
                await updateDoc(doc(db, "products", id), {
                    name: document.getElementById('editName').value,
                    category: document.getElementById('editCat').value,
                    description: document.getElementById('editDesc').value,
                    price: Number(document.getElementById('editPrice').value),
                    stock: Number(document.getElementById('editQty').value)
                });
                alert("تم تحديث المنتج بنجاح!");
                closeEditModal();
                loadProducts();
            } catch (e) { alert("خطأ في التعديل!"); }
        };

        window.deleteOrder = async function(id) {
            if(confirm("حذف هذا الطلب؟")) { 
                await deleteDoc(doc(db, "orders", id)); 
                loadOrders(); 
            }
        };

        window.deleteProduct = async function(id) {
            if(confirm("هل أنت تأكد من حذف هذا المنتج؟")) { 
                try {
                    await deleteDoc(doc(db, "products", id)); 
                    alert("تم حذف المنتج بنجاح!");
                    loadProducts(); 
                } catch(e) {
                    alert("حدث خطأ أثناء الحذف!");
                }
            }
        };
    </script>
</body>
</html>
